# Required GitHub repository secrets:
#   SERVER_HOST      Public IP or host name of the Linux server.
#   SERVER_USER      SSH user, for example root.
#   SERVER_SSH_KEY   Complete PEM private key authorized on the server.
#
# The image is built on GitHub Actions, compressed, and transferred to the
# server via SCP — no external registry pull needed.
#
# Optional GitHub repository variables:
#   FAST_API_HOST_PORT  Host loopback port exposed by the container. Default: 3001.
#   FAST_API_BASE_PATH  Public frontend base path. Default: /fast-api/.
#   FAST_API_DOCKER_NETWORK  Docker network attached to the container. Default: ai-internal.

name: Deploy Fast API

on:
  push:
    branches:
      - my-custom
    paths-ignore:
      - docs-site/**
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: deploy-fast-api
  cancel-in-progress: true

env:
  FAST_API_HOST_PORT: ${{ vars.FAST_API_HOST_PORT || '3001' }}
  FAST_API_BASE_PATH: ${{ vars.FAST_API_BASE_PATH || '/fast-api/' }}
  FAST_API_DOCKER_NETWORK: ${{ vars.FAST_API_DOCKER_NETWORK || 'ai-internal' }}

jobs:
  build-push-deploy:
    name: Build, transfer and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve upstream version
        run: git describe --tags --abbrev=0 > VERSION

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fast-api:deploy
          build-args: |
            WEB_BASE_PATH=${{ env.FAST_API_BASE_PATH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save and compress image
        run: |
          docker save fast-api:deploy | gzip > fast-api.tar.gz
          ls -lh fast-api.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: fast-api.tar.gz
          target: /tmp/

      - name: Deploy on server
        if: ${{ success() }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -Eeuo pipefail

            CONTAINER_NAME="fast-api"
            DATA_DIR="/data/fast-api"
            HOST_PORT="${{ env.FAST_API_HOST_PORT }}"
            DOCKER_NETWORK="${{ env.FAST_API_DOCKER_NETWORK }}"

            mkdir -p "$DATA_DIR"
            if [ ! -f "$DATA_DIR/.env" ]; then
              cat > "$DATA_DIR/.env.example" <<'EOF'
            PORT=3000
            TZ=Asia/Shanghai
            SESSION_SECRET=<CHANGE_TO_A_LONG_RANDOM_STRING>
            CRYPTO_SECRET=<CHANGE_TO_A_LONG_RANDOM_STRING>
            SESSION_COOKIE_SECURE=true
            SQLITE_PATH=/data/fast-api.db?_busy_timeout=30000
            NODE_NAME=fast-api-node-1
            MEMORY_CACHE_ENABLED=false
            BATCH_UPDATE_ENABLED=true
            ERROR_LOG_ENABLED=true
            STREAMING_TIMEOUT=300
            EOF
              echo "Missing $DATA_DIR/.env. Created $DATA_DIR/.env.example; deployment requires a real .env file." >&2
              exit 1
            fi

            docker load -i /tmp/fast-api.tar.gz
            rm -f /tmp/fast-api.tar.gz
            docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || docker network create "$DOCKER_NETWORK"
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart always \
              --network bridge \
              --env-file "$DATA_DIR/.env" \
              -p "127.0.0.1:${HOST_PORT}:3000" \
              -v "$DATA_DIR:/data" \
              fast-api:deploy

            docker network connect --alias "$CONTAINER_NAME" "$DOCKER_NETWORK" "$CONTAINER_NAME"

            docker ps --filter "name=${CONTAINER_NAME}"
