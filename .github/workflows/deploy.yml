# Required GitHub repository secrets:
#   SERVER_HOST      Public IP or host name of the Linux server.
#   SERVER_USER      SSH user, for example root.
#   SERVER_SSH_KEY   Complete PEM private key authorized on the server.
#
# The image is pushed to GitHub Container Registry (ghcr.io) — no Docker Hub needed.
# The default GITHUB_TOKEN has packages:write permission for the current repository.
#
# Optional GitHub repository variables:
#   FAST_API_HOST_PORT  Host loopback port exposed by the container. Default: 3001.
#   FAST_API_BASE_PATH  Public frontend base path. Default: /fast-api/.

name: Deploy Fast API

on:
  push:
    branches:
      - main
      - my-custom
  workflow_dispatch:

concurrency:
  group: deploy-fast-api
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fast-api
  IMAGE_TAG: latest
  FAST_API_HOST_PORT: ${{ vars.FAST_API_HOST_PORT || '3001' }}
  FAST_API_BASE_PATH: ${{ vars.FAST_API_BASE_PATH || '/fast-api/' }}

jobs:
  build-push-deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            WEB_BASE_PATH=${{ env.FAST_API_BASE_PATH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on server
        if: ${{ success() }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -Eeuo pipefail

            IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            CONTAINER_NAME="fast-api"
            DATA_DIR="/data/fast-api"
            HOST_PORT="${{ env.FAST_API_HOST_PORT }}"

            mkdir -p "$DATA_DIR"
            if [ ! -f "$DATA_DIR/.env" ]; then
              cat > "$DATA_DIR/.env.example" <<'EOF'
            PORT=3000
            TZ=Asia/Shanghai
            SESSION_SECRET=<CHANGE_TO_A_LONG_RANDOM_STRING>
            CRYPTO_SECRET=<CHANGE_TO_A_LONG_RANDOM_STRING>
            SQLITE_PATH=/data/fast-api.db?_busy_timeout=30000
            NODE_NAME=fast-api-node-1
            MEMORY_CACHE_ENABLED=false
            BATCH_UPDATE_ENABLED=true
            ERROR_LOG_ENABLED=true
            STREAMING_TIMEOUT=300
            EOF
              echo "Missing $DATA_DIR/.env. Created $DATA_DIR/.env.example; deployment requires a real .env file." >&2
              exit 1
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            docker pull "$IMAGE"
            docker logout ghcr.io
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart always \
              --env-file "$DATA_DIR/.env" \
              -p "127.0.0.1:${HOST_PORT}:3000" \
              -v "$DATA_DIR:/data" \
              "$IMAGE"

            docker ps --filter "name=${CONTAINER_NAME}"
