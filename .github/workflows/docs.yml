name: Deploy Documentation

on:
  push:
    branches:
      - my-custom
    paths:
      - docs-site/**
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: deploy-documentation
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build documentation
        working-directory: docs-site
        run: npm run build

      - name: Package documentation
        run: tar -C docs-site/.vitepress/dist -czf fast-api-docs.tar.gz .

      - name: Copy documentation to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: fast-api-docs.tar.gz
          target: /tmp/

      - name: Publish documentation
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -Eeuo pipefail
            DOCS_DIR=/var/www/fast-api-docs
            mkdir -p "$DOCS_DIR"
            find "$DOCS_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            tar -xzf /tmp/fast-api-docs.tar.gz -C "$DOCS_DIR"
            rm -f /tmp/fast-api-docs.tar.gz
            nginx -t
            systemctl reload nginx
